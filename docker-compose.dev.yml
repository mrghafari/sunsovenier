version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://momtaz:momtaz_password@db:5432/momtaz_chem
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - momtaz-network

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=momtaz
      - POSTGRES_PASSWORD=momtaz_password
      - POSTGRES_DB=momtaz_chem
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U momtaz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - momtaz-network

volumes:
  postgres_data_dev:

networks:
  momtaz-network:
    driver: bridge

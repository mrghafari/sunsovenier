name: CI/CD Deploy

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: mrghafari/momtazchem-app
  DOCKER_TAG: latest
  SLACK_CHANNEL: "#ci-cd"
  SLACK_USERNAME: "CI/CD Bot"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Docker Buildx
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3️⃣ Log in to DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4️⃣ Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            --build-arg NODE_ENV=production \
            -t $IMAGE_NAME:$DOCKER_TAG .

      # 5️⃣ Push Docker image to DockerHub
      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME:$DOCKER_TAG

      # 6️⃣ Notify Slack on success
      - name: Slack Success Notification
        if: success()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          channel-id: ${{ env.SLACK_CHANNEL }}
          slack-message: ":white_check_mark: CI/CD build and deploy succeeded! Image: $IMAGE_NAME:$DOCKER_TAG"
          bot-token: ${{ secrets.SLACK_BOT_TOKEN }}

      # 7️⃣ Notify Slack on failure
      - name: Slack Failure Notification
        if: failure()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          channel-id: ${{ env.SLACK_CHANNEL }}
          slack-message: ":x: CI/CD build or deploy failed!"
          bot-token: ${{ secrets.SLACK_BOT_TOKEN }}

name: CI/CD Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: mrghafari
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          timeout: 900s
          script: |
            set -euxo pipefail
            cd /opt/momtazchem

            echo "Pulling latest Docker image..."
            docker pull mrghafari/momtazchem-app:latest

            OLD_CONTAINER=$(docker ps -qf "name=app")
            if [ -n "$OLD_CONTAINER" ]; then
              docker rename app app_old_$(date +%s)
            fi

            echo "Pulling Compose service..."
            docker compose pull app

            echo "Starting new container..."
            docker compose up -d --no-deps app

            sleep 15
            NEW_CONTAINER=$(docker ps -qf "name=app")
            HEALTH_STATUS=$(docker inspect --format='{{.State.Health.Status}}' $NEW_CONTAINER || echo "unknown")

            if [ "$HEALTH_STATUS" != "healthy" ]; then
              echo "❌ New container failed health check! Rolling back..."
              docker rm -f $NEW_CONTAINER || true

              # Rollback امن‌تر
              OLD=$(docker ps -a -q --filter "name=app_old_*" | head -n1)
              [ -n "$OLD" ] && docker rename $OLD app && docker start app

              exit 1
            fi

            if [ -n "$OLD_CONTAINER" ]; then
              docker rm -f $OLD_CONTAINER || true
            fi

            docker image prune -f
            docker compose logs -f --tail 50
            echo "Deployment successful ✅"

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": ":white_check_mark: Deployment completed successfully for branch *${{ github.ref_name }}*."
            }

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": ":x: Deployment failed for branch *${{ github.ref_name }}*. Check logs!"
            }

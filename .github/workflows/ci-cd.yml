name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: mrghafari/momtazchem-app
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }} # optional

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest

      - name: SSH Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          port: 22
          timeout: 15m
          script: |
            set -e
            cd /opt/momtazchem
            echo "Pulling latest image..."
            docker pull mrghafari/momtazchem-app:latest
            OLD_CONTAINER=$(docker ps -qf "name=app")
            if [ -n "$OLD_CONTAINER" ]; then
              docker rename app app_old_$(date +%s)
            fi
            echo "Starting new container..."
            docker compose up -d --no-deps app
            sleep 15
            NEW_CONTAINER=$(docker ps -qf "name=app")
            HEALTH_STATUS=$(docker inspect --format='{{.State.Health.Status}}' $NEW_CONTAINER || echo "unknown")
            if [ "$HEALTH_STATUS" != "healthy" ]; then
              echo "❌ New container failed health check! Rolling back..."
              docker rm -f $NEW_CONTAINER
              if [ -n "$OLD_CONTAINER" ]; then
                docker rename $(docker ps -a -qf "name=app_old_*") app
                docker start app
              fi
              exit 1
            fi
            if [ -n "$OLD_CONTAINER" ]; then
              docker rm -f $OLD_CONTAINER || true
            fi
            docker image prune -f
            docker compose logs -f --tail 50
            echo "Deployment successful ✅"

      - name: Notify Slack
        if: ${{ env.SLACK_WEBHOOK != '' }}
        uses: slackapi/slack-github-action@v1.27.0
        with:
          webhook-url: ${{ env.SLACK_WEBHOOK }}
          slack-message: "Deployment of mrghafari/momtazchem-app successful ✅"

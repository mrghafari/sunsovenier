name: CI/CD Deploy

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: mrghafari/momtazchem-app
  CONTAINER_NAME: momtaz-app
  SSH_USER: root
  SSH_HOST: 5.75.170.42
  SSH_PORT: 22

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2️⃣ Login to DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3️⃣ Generate short SHA tag
      - name: Set image tag
        id: vars
        run: echo "TAG=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      # 4️⃣ Remove Replit-internal npm URLs from lockfile before Docker build
      - name: Normalize npm registry URLs
        run: |
          set -e
          sed -i -E 's#https?://package-firewall\.replit\.internal/npm/#https://registry.npmjs.org/#g' package-lock.json
          if grep -nE 'replit\.internal|package-firewall' package-lock.json; then
            echo "ERROR: Replit-internal npm URL still exists in package-lock.json"
            exit 1
          fi
          echo "npm registry URLs verified."

      # 5️⃣ Build Docker image
      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:${{ steps.vars.outputs.TAG }} .
          docker tag $IMAGE_NAME:${{ steps.vars.outputs.TAG }} $IMAGE_NAME:latest

      # 6️⃣ Push images to DockerHub
      - name: Push Docker images
        run: |
          docker push $IMAGE_NAME:${{ steps.vars.outputs.TAG }}
          docker push $IMAGE_NAME:latest

      # 7️⃣ Deploy to server using docker-compose
      - name: Deploy to server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ env.SSH_PORT }}
          script: |
            set -e
            cd /opt/momtazchem

            echo "Pulling latest images..."
            docker-compose pull

            echo "Restarting containers with docker-compose..."
            docker-compose up -d --remove-orphans

            echo "Cleaning old images (keep latest + 5 previous versions)..."
            docker images "$IMAGE_NAME" --format "{{.Repository}}:{{.Tag}}" \
              | grep -v ':latest$' \
              | tail -n +6 \
              | xargs -r docker rmi || true

            echo "Cleaning dangling images..."
            docker image prune -f

            echo "Docker disk usage after cleanup:"
            docker system df

            echo "✅ Deployment complete!"

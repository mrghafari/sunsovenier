name: CI/CD Deploy

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: mrghafari/momtazchem-app
  CONTAINER_NAME: momtaz-app
  DOCKER_COMPOSE_PATH: /opt/momtazchem/docker-compose.yml
  SSH_USER: root
  SSH_HOST: 5.75.170.42
  SSH_PORT: 22

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository container: 
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Setup Node.js for build
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 3️⃣ Login to DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4️⃣ Build Docker image
      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:latest .

      # 5️⃣ Push Docker image
      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME:latest

      # 6️⃣ Deploy on server via SSH using new key
      - name: Deploy to server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ env.SSH_PORT }}
          script: |
            cd /opt/momtazchem
            docker-compose pull app
            docker-compose up -d --remove-orphans
      

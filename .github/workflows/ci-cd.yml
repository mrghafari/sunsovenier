name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Build Docker image
        run: |
          docker build -t mrghafari/momtazchem-app:latest .

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: docker push mrghafari/momtazchem-app:latest

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            cd /opt/momtazchem
            # Save previous image for rollback
            PREVIOUS_IMAGE=$(docker inspect --format='{{.Config.Image}}' momtaz-app 2>/dev/null || echo "")
            echo "🔹 Pulling new image..."
            docker pull mrghafari/momtazchem-app:latest
            echo "🔹 Updating container..."
            docker compose up -d --pull always
            echo "🔹 Waiting for container to be healthy..."
            sleep 25
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' momtaz-app 2>/dev/null || echo "no-health")
            echo "Health status: $STATUS"
            if [ "$STATUS" = "unhealthy" ]; then
              echo "❌ Deployment failed. Rolling back..."
              if [ -n "$PREVIOUS_IMAGE" ]; then
                docker pull $PREVIOUS_IMAGE
                docker tag $PREVIOUS_IMAGE mrghafari/momtazchem-app:latest
                docker compose up -d
              fi
              exit 1
            fi
            echo "✅ Deployment successful"
            docker image prune -f

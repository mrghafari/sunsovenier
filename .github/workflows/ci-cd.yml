name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Build & push Docker image
      - name: Build & Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: mrghafari/momtazchem-app:latest

      # Deploy via SSH
      - name: Deploy to Server
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          timeout: 15m
          script: |
            set -e
            cd /opt/momtazchem
            echo "Pulling latest image..."
            docker pull mrghafari/momtazchem-app:latest

            OLD_CONTAINER=$(docker ps -qf "name=app")
            if [ -n "$OLD_CONTAINER" ]; then
              docker rename app app_old_$(date +%s)
            fi

            echo "Starting new container..."
            docker compose up -d --no-deps app

            sleep 15
            NEW_CONTAINER=$(docker ps -qf "name=app")
            HEALTH_STATUS=$(docker inspect --format='{{.State.Health.Status}}' $NEW_CONTAINER || echo "unknown")
            CONTAINER_LOGS=$(docker compose logs --tail 50 app || echo "No logs available")

            echo "HEALTH_STATUS=$HEALTH_STATUS" >> $GITHUB_ENV
            echo "CONTAINER_LOGS<<EOF" >> $GITHUB_ENV
            echo "$CONTAINER_LOGS" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV

            if [ "$HEALTH_STATUS" != "healthy" ]; then
              echo "❌ New container failed health check! Rolling back..."
              docker rm -f $NEW_CONTAINER
              if [ -n "$OLD_CONTAINER" ]; then
                docker rename $(docker ps -a -qf "name=app_old_*") app
                docker start app
              fi
              exit 1
            fi

            if [ -n "$OLD_CONTAINER" ]; then
              docker rm -f $OLD_CONTAINER || true
            fi

            docker image prune -f
            echo "Deployment successful ✅"

      # Slack notification with logs and health status
      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          slack-message: |
            *Deployment Status:* ${{ job.status }}
            *Commit:* ${{ github.sha }}
            *Branch:* ${{ github.ref_name }}
            *Health:* ${{ env.HEALTH_STATUS }}
            *Recent Logs:*
            ```
            ${{ env.CONTAINER_LOGS }}
            ```

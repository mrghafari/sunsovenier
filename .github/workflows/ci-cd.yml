name: MomtazChem CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: mrghafari/momtazchem-api
  DEPLOY_DIR: /root/MomtazChem
  DOCKER_COMPOSE_FILE: docker-compose.yml

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Test Docker Image
        run: |
          docker run --rm ${{ env.IMAGE_NAME }}:${{ github.sha }} npm run test

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to Server
        run: |
          set -e
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << EOF
            set -e
            cd $DEPLOY_DIR

            echo "Pulling latest image..."
            docker compose pull || true

            echo "Backing up current image for rollback..."
            CURRENT_IMAGE=\$(docker compose images -q app)
            docker tag \$CURRENT_IMAGE ${{ env.IMAGE_NAME }}:backup || true

            echo "Recreating containers..."
            if docker compose up -d --remove-orphans; then
              echo "Deployment successful!"
            else
              echo "Deployment failed! Rolling back..."
              docker compose down
              docker tag ${{ env.IMAGE_NAME }}:backup \$CURRENT_IMAGE
              docker compose up -d
              exit 1
            fi
EOF

      - name: Notify Slack on Failure
        if: failure()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          slack-token: ${{ secrets.SLACK_BOT_TOKEN }}
          text: "❌ Deployment of MomtazChem failed on commit ${{ github.sha }}!"

      - name: Notify Slack on Success
        if: success()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          slack-token: ${{ secrets.SLACK_BOT_TOKEN }}
          text: "✅ Deployment of MomtazChem succeeded on commit ${{ github.sha }}!"

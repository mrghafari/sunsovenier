name: MomtazChem Production Pipeline

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: mrghafari/momtazchem-api
  DEPLOY_DIR: /root/MomtazChem

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline

      - name: Smoke Test Container
        run: |
          docker run -d --name test_container -p 5001:5000 ${{ env.IMAGE_NAME }}:${{ github.sha }}
          sleep 10
          curl -f http://localhost:5001/api/health
          docker stop test_container
          docker rm test_container

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy with Rollback
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << EOF
          set -e
          cd $DEPLOY_DIR

          echo "Pulling new image..."
          docker pull $IMAGE_NAME:${{ github.sha }}

          echo "Tagging previous image for rollback..."
          OLD_IMAGE=\$(docker inspect --format='{{.Config.Image}}' momtazchem-app || true)
          if [ ! -z "\$OLD_IMAGE" ]; then
            docker tag \$OLD_IMAGE $IMAGE_NAME:rollback || true
          fi

          echo "Updating docker-compose to new SHA..."
          sed -i "s|image: .*|image: $IMAGE_NAME:${{ github.sha }}|" docker-compose.yml

          echo "Recreating container..."
          docker compose up -d --remove-orphans

          echo "Waiting for healthcheck..."
          sleep 20

          if ! curl -f http://localhost:5000/api/health; then
            echo "Healthcheck failed. Rolling back..."
            sed -i "s|image: .*|image: $IMAGE_NAME:rollback|" docker-compose.yml
            docker compose up -d
            exit 1
          fi

          echo "Deployment successful."
          EOF

      - name: Slack Failure
        if: failure()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          slack-token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "text": "❌ MomtazChem deployment FAILED on commit ${{ github.sha }}"
            }

      - name: Slack Success
        if: success()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          slack-token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "text": "✅ MomtazChem deployment SUCCESS on commit ${{ github.sha }}"
            }

name: CI/CD

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout repo
      uses: actions/checkout@v3

    # --- Login to Docker Hub ---
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: mrghafari
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # --- Build and Push Docker Image ---
    - name: Build & Push Docker Image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: mrghafari/momtazchem-app:latest

    # --- Deploy via SSH ---
    - name: SSH Deploy
      uses: appleboy/ssh-action@v1.7.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        port: 22
        timeout: 15m
        script: |
          set -e
          cd /opt/momtazchem
          echo "Pulling latest image..."
          docker pull mrghafari/momtazchem-app:latest
          OLD_CONTAINER=$(docker ps -qf "name=app")
          if [ -n "$OLD_CONTAINER" ]; then
            docker rename app app_old_$(date +%s)
          fi
          echo "Starting new container..."
          docker compose up -d --no-deps app
          sleep 15
          NEW_CONTAINER=$(docker ps -qf "name=app")
          HEALTH_STATUS=$(docker inspect --format='{{.State.Health.Status}}' $NEW_CONTAINER || echo "unknown")
          if [ "$HEALTH_STATUS" != "healthy" ]; then
            echo "❌ New container failed health check! Rolling back..."
            docker rm -f $NEW_CONTAINER
            if [ -n "$OLD_CONTAINER" ]; then
              docker rename $(docker ps -a -qf "name=app_old_*") app
              docker start app
            fi
            exit 1
          fi
          if [ -n "$OLD_CONTAINER" ]; then
            docker rm -f $OLD_CONTAINER || true
          fi
          docker image prune -f
          docker compose logs -f --tail 50
          echo "Deployment successful ✅"

    # --- Slack Notification ---
    - name: Slack Notification
      uses: slackapi/slack-github-action@v1.27.0
      with:
        webhook-url: ${{ secrets.SLACK_WEBHOOK }}
        payload: '{"text":"Deployment completed ✅"}'

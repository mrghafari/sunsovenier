name: CI/CD Deployment

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ دریافت آخرین کد
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ ورود به Docker Hub
      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3️⃣ ساخت Docker image طبق Dockerfile اصلی
      - name: Build Docker image
        run: docker build -t mrghafari/momtazchem-app:latest .

      # 4️⃣ Push image به Docker Hub
      - name: Push Docker image
        run: docker push mrghafari/momtazchem-app:latest

      # 5️⃣ Deployment روی سرور از طریق SSH
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}      # 5.75.170.42
          username: ${{ secrets.SERVER_USER }}  # root
          key: ${{ secrets.SERVER_SSH_KEY }}    # Private key PEM
          port: 22
          script: |
            cd /opt/momtazchem
            docker pull mrghafari/momtazchem-app:latest
            docker compose up -d --pull always
            echo "✅ Deployment finished"

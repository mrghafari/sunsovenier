name: CI/CD Deploy

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: mrghafari/momtazchem-app:latest
  REMOTE_DIR: /opt/momtazchem

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # 3️⃣ Build Docker image
      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME .

      # 4️⃣ Push Docker image
      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME

      # 5️⃣ Deploy to server via SSH
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}      # مثال: 5.75.170.42
          username: ${{ secrets.SERVER_USER }}  # مثال: root
          key: ${{ secrets.SERVER_SSH_KEY }}    # private SSH key
          port: 22
          script: |
            set -e
            cd $REMOTE_DIR

            # Pull new image
            PREVIOUS_IMAGE=$(docker inspect --format='{{.Config.Image}}' momtaz-app 2>/dev/null || echo "")
            docker pull $IMAGE_NAME

            # Update container
            docker compose up -d --pull always

            # Wait for health
            sleep 25
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' momtaz-app 2>/dev/null || echo "no-health")
            echo "Health status: $STATUS"

            if [ "$STATUS" = "unhealthy" ]; then
              echo "❌ Deployment failed. Rolling back..."
              if [ -n "$PREVIOUS_IMAGE" ]; then
                docker pull $PREVIOUS_IMAGE
                docker tag $PREVIOUS_IMAGE $IMAGE_NAME
                docker compose up -d
              fi
              exit 1
            fi

            echo "✅ Deployment successful"
            docker image prune -f

name: CI/CD Deploy Final

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: mrghafari/momtazchem-app
  DEFAULT_USERNAME: mrghafari

concurrency:
  group: "deploy-momtazchem"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Validate DockerHub secrets
      - name: Validate DockerHub secrets
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "⚠️ Secrets DOCKERHUB_USERNAME or DOCKERHUB_TOKEN are empty. Using default username."
          else
            echo "✅ DockerHub secrets found."
          fi

      # Login to Docker Hub
      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || env.DEFAULT_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build & Push Docker image
      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          platform: linux/amd64

      # Deploy via SSH
      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 15m
          script: |
            set -e
            cd /opt/momtazchem

            echo "Pulling latest image..."
            docker pull ${{ env.IMAGE_NAME }}:latest

            OLD_CONTAINER=$(docker ps -qf "name=app")
            if [ -n "$OLD_CONTAINER" ]; then
              docker rename app app_old_$(date +%s)
            fi

            echo "Starting new container..."
            docker compose up -d --no-deps app

            # Healthcheck: wait 15 seconds
            sleep 15
            NEW_CONTAINER=$(docker ps -qf "name=app")
            HEALTH_STATUS=$(docker inspect --format='{{.State.Health.Status}}' $NEW_CONTAINER || echo "unknown")
            
            if [ "$HEALTH_STATUS" != "healthy" ]; then
              echo "❌ New container failed health check! Rolling back..."
              docker rm -f $NEW_CONTAINER
              if [ -n "$OLD_CONTAINER" ]; then
                docker rename $(docker ps -a -qf "name=app_old_*") app
                docker start app
              fi
              exit 1
            fi

            if [ -n "$OLD_CONTAINER" ]; then
              docker rm -f $OLD_CONTAINER || true
            fi

            docker image prune -f
            docker compose logs -f --tail 50
            echo "Deployment successful ✅"

      # Slack notification using official Slack action
      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          slack-message: |
            Deployment of `${{ env.IMAGE_NAME }}` to `${{ secrets.SERVER_HOST }}` finished with status: ${{ job.status }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

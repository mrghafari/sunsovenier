name: CI/CD Deploy

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: mrghafari/momtazchem-app
  CONTAINER_NAME: momtaz-app
  SSH_USER: root
  SSH_HOST: 5.75.170.42
  SSH_PORT: 22

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Login to DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3️⃣ Generate short SHA tag
      - name: Set image tag
        id: vars
        run: echo "TAG=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      # 4️⃣ Build image (version + latest)
      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:${{ steps.vars.outputs.TAG }} .
          docker tag $IMAGE_NAME:${{ steps.vars.outputs.TAG }} $IMAGE_NAME:latest

      # 5️⃣ Push images
      - name: Push Docker images
        run: |
          docker push $IMAGE_NAME:${{ steps.vars.outputs.TAG }}
          docker push $IMAGE_NAME:latest

      # 6️⃣ Deploy specific version to server
      - name: Deploy to server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ env.SSH_PORT }}
          script: |
            cd /opt/momtazchem

            echo "Pulling version ${{ steps.vars.outputs.TAG }}"
            docker pull $IMAGE_NAME:${{ steps.vars.outputs.TAG }}

            echo "Stopping old container"
            docker stop $CONTAINER_NAME || true
            docker rm $CONTAINER_NAME || true

            echo "Starting new container"
            docker run -d \
              --name $CONTAINER_NAME \
              -p 5000:5000 \
              --env-file .env \
              $IMAGE_NAME:${{ steps.vars.outputs.TAG }}

            echo "Cleaning old images (keep last 5)"
            docker images $IMAGE_NAME --format "{{.Repository}}:{{.Tag}}" \
              | grep -v latest \
              | tail -n +6 \
              | xargs -r docker rmi || true

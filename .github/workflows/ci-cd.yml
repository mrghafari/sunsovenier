name: MomtazChem Production Pipeline

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: mrghafari/momtazchem-api
  DEPLOY_DIR: /root/MomtazChem

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline

      # فقط بررسی می‌کنیم کانتینر crash نکند
      - name: Basic Container Start Test
        run: |
          docker run -d \
            --name test_container \
            -p 5001:5000 \
            -e NODE_ENV=production \
            -e PORT=5000 \
            -e HOST=0.0.0.0 \
            -e DATABASE_URL=dummy \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

          sleep 10
          docker ps
          docker logs test_container

          docker stop test_container || true
          docker rm test_container || true

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to Server (Neon env based)
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << EOF
          set -e
          cd $DEPLOY_DIR

          echo "Pulling new image..."
          docker pull $IMAGE_NAME:${{ github.sha }}

          echo "Backup current image..."
          CURRENT_IMAGE=\$(docker inspect --format='{{.Config.Image}}' momtaz-app || true)
          if [ ! -z "\$CURRENT_IMAGE" ]; then
            docker tag \$CURRENT_IMAGE $IMAGE_NAME:rollback || true
          fi

          echo "Update compose image..."
          sed -i "s|image: .*|image: $IMAGE_NAME:${{ github.sha }}|" docker-compose.yml

          echo "Restarting service..."
          docker compose up -d --remove-orphans

          echo "Waiting for app..."
          sleep 20

          if ! curl -f http://localhost:5000/api/health; then
            echo "Healthcheck failed. Rolling back..."
            sed -i "s|image: .*|image: $IMAGE_NAME:rollback|" docker-compose.yml
            docker compose up -d
            exit 1
          fi

          echo "Deployment successful."
          EOF

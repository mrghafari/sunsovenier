name: MomtazChem Production CI/CD

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: momtazchem-app
  DOCKERHUB_USERNAME: mrghafari

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3️⃣ Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4️⃣ Build & Push Docker Image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            mrghafari/momtazchem-app:latest
            mrghafari/momtazchem-app:${{ github.sha }}
          cache-from: type=registry,ref=mrghafari/momtazchem-app:latest
          cache-to: type=inline
          build-args: |
            NODE_ENV=production

      # 5️⃣ Deploy to VPS via SSH with Healthcheck & Rollback
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            cd /opt/momtazchem

            # Save previous image
            PREVIOUS_IMAGE=$(docker inspect --format='{{.Config.Image}}' momtaz-app 2>/dev/null || echo "")

            echo "🔹 Pulling new image..."
            docker pull mrghafari/momtazchem-app:latest

            echo "🔹 Updating container..."
            docker compose up -d --pull always

            echo "🔹 Waiting for container to be healthy..."
            sleep 25

            STATUS=$(docker inspect --format='{{.State.Health.Status}}' momtaz-app 2>/dev/null || echo "no-health")
            echo "Health status: $STATUS"

            if [ "$STATUS" = "unhealthy" ]; then
              echo "❌ Deployment failed. Rolling back..."

              if [ -n "$PREVIOUS_IMAGE" ]; then
                docker pull $PREVIOUS_IMAGE
                docker tag $PREVIOUS_IMAGE mrghafari/momtazchem-app:latest
                docker compose up -d
              fi

              exit 1
            fi

            echo "✅ Deployment successful"
            docker image prune -f

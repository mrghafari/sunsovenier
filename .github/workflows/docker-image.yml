name: MomtazChem CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Node.js setup
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # Backend dependencies
      - name: Install backend dependencies
        run: npm install

      # Frontend dependencies
      - name: Install frontend dependencies
        run: |
          cd client
          npm install

      # Build frontend
      - name: Build frontend
        run: |
          cd client
          npm run build

      # Run tests (اختیاری)
      - name: Run tests
        run: npm test || true

      # Build Docker image
      - name: Build Docker image
        run: |
          docker build -t momtazchem-app:latest .

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # SSH setup
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Deploy Docker container with minimal downtime
      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            echo "Pulling latest Docker image..."
            docker pull momtazchem-app:latest

            echo "Stopping old container (if exists)..."
            docker stop momtazchem-container || true

            echo "Removing old container..."
            docker rm momtazchem-container || true

            echo "Running new container with same volumes and ports..."
            docker run -d \
              --name momtazchem-container \
              -p 80:80 \
              -v /host/path/data:/app/data \   # مطمئن شوید مسیر داده‌ها درست است
              momtazchem-app:latest

            echo "Deployment completed successfully!"
          EOF

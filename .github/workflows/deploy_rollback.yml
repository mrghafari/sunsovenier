name: CI/CD Deploy MomtazChem with Rollback

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Setup SSH
      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      # 3. Sync project to server
      - name: Sync project
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            mkdir -p ~/MomtazChem_deploy &&
            rsync -avz --exclude '.git' --exclude '.github' ./ ~/MomtazChem_deploy/
          "

      # 4. Backup current database
      - name: Backup DB before deploy
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            TIMESTAMP=\$(date +'%Y%m%d%H%M%S') &&
            mkdir -p ~/MomtazChem_deploy/backups &&
            docker exec momtazchem-db pg_dump -U ${POSTGRES_USER:-momtaz} ${POSTGRES_DB:-momtaz_chem} > ~/MomtazChem_deploy/backups/db_backup_\$TIMESTAMP.sql &&
            echo \$TIMESTAMP > ~/MomtazChem_deploy/backups/last_backup.txt
          "

      # 5. Backup current containers for rollback
      - name: Save current container images
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            docker commit momtazchem-app momtazchem-app_backup &&
            docker save -o ~/MomtazChem_deploy/backups/momtazchem-app_backup.tar momtazchem-app_backup
          "

      # 6. Deploy new containers
      - name: Deploy containers
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            cd ~/MomtazChem_deploy &&
            docker-compose pull &&
            docker-compose up -d --build --remove-orphans
          "

      # 7. Health check with rollback
      - name: Health check & rollback if needed
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            RETRIES=5
            for i in \$(seq 1 \$RETRIES); do
              if curl -f http://localhost:5000/api/health; then
                echo 'Backend is healthy'
                exit 0
              else
                echo 'Backend not ready, retrying... (\$i/\$RETRIES)'
                sleep 10
              fi
            done
            echo 'Health check failed! Rolling back...'

            # Restore previous container
            docker load -i ~/MomtazChem_deploy/backups/momtazchem-app_backup.tar
            docker stop momtazchem-app
            docker rm momtazchem-app
            docker run -d --name momtazchem-app -p 5000:5000 momtazchem-app_backup

            # Restore database
            LAST_BACKUP=\$(cat ~/MomtazChem_deploy/backups/last_backup.txt)
            docker exec -i momtazchem-db psql -U ${POSTGRES_USER:-momtaz} ${POSTGRES_DB:-momtaz_chem} < ~/MomtazChem_deploy/backups/db_backup_\$LAST_BACKUP.sql

            echo 'Rollback completed'
            exit 1
          "

      # 8. Success message
      - name: Deployment success
        if: success()
        run: echo "Deployment completed successfully!"

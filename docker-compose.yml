version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: momtaz-app
    ports:
      - "${APP_PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - HOST=0.0.0.0
      - DATABASE_URL=${DATABASE_URL:-postgresql://momtaz:momtaz_password@db:5432/momtaz_chem}
      - SESSION_SECRET=${SESSION_SECRET:-your-session-secret-change-in-production}
      - AWS_CREDENTIALS_ENCRYPTION_KEY=${AWS_CREDENTIALS_ENCRYPTION_KEY:-}
      - AWS_ACCESS_KEY_ID_NEW=${AWS_ACCESS_KEY_ID_NEW:-}
      - AWS_SECRET_ACCESS_KEY_NEW=${AWS_SECRET_ACCESS_KEY_NEW:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - FACEBOOK_APP_ID=${FACEBOOK_APP_ID:-}
      - FACEBOOK_APP_SECRET=${FACEBOOK_APP_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - momtaz-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:15-alpine
    container_name: momtaz-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-momtaz}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-momtaz_password}
      - POSTGRES_DB=${POSTGRES_DB:-momtaz_chem}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-momtaz} -d ${POSTGRES_DB:-momtaz_chem}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - momtaz-network

  nginx:
    image: nginx:alpine
    container_name: momtaz-nginx
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - momtaz-network
    profiles:
      - with-nginx

volumes:
  postgres_data:
    driver: local

networks:
  momtaz-network:
    driver: bridge

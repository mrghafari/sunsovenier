version: "3.9"

services:
  app:
    # ?? ????? CI/CD ????? ??????? ??? ?? build ????
    # image: mrghafari/momtazchem-api:latest
    build:
      context: .
      dockerfile: Dockerfile

    container_name: momtaz-app
    ports:
      - "5000:5000"

    environment:
      NODE_ENV: production
      PORT: 5000
      HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}

      # AWS / Object Storage ???? secure upload
      PRIVATE_OBJECT_DIR: ${PRIVATE_OBJECT_DIR}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}

    volumes:
      - ./uploads:/app/uploads  # ???? ??????? ??? host

    restart: unless-stopped
    networks:
      - momtaz-network

networks:
  momtaz-network:
    driver: bridge

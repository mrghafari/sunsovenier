version: "3.9"

services:
  app:
    image: mrghafari/momtazchem-api:latest
    container_name: momtaz-app
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped
    networks:
      - momtaz-network

networks:
  momtaz-network:
    driver: bridge
